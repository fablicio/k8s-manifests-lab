apiVersion: v1
kind: ConfigMap
metadata:
    name: nginx-index-config
data:
    index.html: |
        <!DOCTYPE html>
        <html lang="pt-BR">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>BlicioLab - Home Lab DevOps</title>
          <style>
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background-color: #0f172a;
                color: #f8fafc;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                margin: 0;
            }
            .card {
                background-color: #1e293b;
                padding: 40px;
                border-radius: 16px;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
                text-align: center;
                max-width: 480px;
                width: 100%;
                border-top: 4px solid #38bdf8;
            }
            .logo {
                width: 220px;          /* Aumentado para dar mais destaque visual */
                height: auto;          /* Mantém a proporção exata da imagem sem distorcer */
                max-height: 220px;     /* Limita a altura máxima */
                border-radius: 12px;   /* Cantos levemente arredondados */
                object-fit: contain;   /* Garante que nenhum pedaço da logo seja cortado */
                margin-bottom: 25px;   /* Espaçamento elegante até o título */
                background-color: #ffffff; /* Fundo branco de destaque */
                padding: 10px;         /* Moldura interna mais espaçosa */
                border: 3px solid #38bdf8; /* Borda azul neon combinando com o tema */
                box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3); /* Sutil efeito de brilho */
            }
            h1 {
                color: #38bdf8;
                margin: 10px 0;
                font-size: 26px;
            }
            p {
                color: #94a3b8;
                font-size: 15px;
                margin-bottom: 20px;
            }
            .badge {
                display: inline-block;
                background-color: #065f46;
                color: #34d399;
                padding: 6px 14px;
                border-radius: 20px;
                font-size: 13px;
                font-weight: bold;
            }
        </style>
        </head>
        <body>
            <div class="card">
                <img src="https://raw.githubusercontent.com/fablicio/k8s-manifests-lab/main/apps/nginx/assets/logo.jpg" alt="BlicioLab Logo" class="logo">
